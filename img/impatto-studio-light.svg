<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 52" role="img" aria-label="Impatto Studio">
  <title>Impatto Studio</title>
  <!-- I-beam mark: top bar (warm white) + stem (warm white) + bottom accent (lime) -->
  <rect x="0" y="4" width="36" height="9" fill="#f5f3ef"/>
  <rect x="12" y="13" width="12" height="26" fill="#f5f3ef"/>
  <rect x="0" y="39" width="36" height="9" fill="#c8ff00"/>
  <!-- Wordmark -->
  <text x="52" y="30"
        font-family="Syne, Montserrat, 'Arial Black', sans-serif"
        font-weight="800"
        font-size="22"
        fill="#f5f3ef"
        letter-spacing="1.5">IMPATTO</text>
  <text x="53.5" y="47"
        font-family="'DM Sans', Montserrat, Arial, sans-serif"
        font-weight="400"
        font-size="10"
        fill="#f5f3ef"
        letter-spacing="5.5">STUDIO</text>
</svg>
